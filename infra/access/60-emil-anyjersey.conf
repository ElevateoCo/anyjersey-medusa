Match User emil-anyjersey
    ChrootDirectory /srv/anyjersey-access
    ForceCommand internal-sftp -d /workspace
    AuthorizedKeysFile /etc/ssh/authorized_keys/emil-anyjersey
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    PermitTunnel no
    AllowAgentForwarding no
    AllowTcpForwarding no
    X11Forwarding no
